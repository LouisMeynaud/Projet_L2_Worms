image: maven:3.8.5-openjdk-17

stages:
  - validate
  - build
  - test
  - package
  - release

variables:
  MAVEN_CLI_OPTS: "-B -ntp -e -Dmaven.repo.local=.m2/repository" # non-interactive, no progress bars, show errors

# Maven dependency cache (shared across jobs)
cache:
  key: maven
  paths:
    - .m2/repository

before_script:
  - |
    if [[ "$RUNNER_PROFILE" == "personal" ]] || [[ "$USER" == "leo" ]]; then
      echo "Proxy disabled"
      export MAVEN_OPTS="-Djava.awt.headless=true"
    else
      echo "Proxy enabled"
      export MAVEN_OPTS="-Dhttps.proxyHost=194.254.199.96 -Dhttps.proxyPort=3128 -Djava.awt.headless=true"
    fi

# Validate - checkstyle before compile
validate:
  stage: validate
  script:
    - mvn $MAVEN_CLI_OPTS -DskipTests clean validate -Pcheckstyle
  artifacts:
    when: always
    expire_in: 3 days
    paths:
      - target/site/checkstyle/checkstyle-result.xml
      - target/reports/checkstyle.html
      - target/reports/**

# Compile - validates pom and compiles sources
compile:
  stage: build
  script:
    - mvn $MAVEN_CLI_OPTS -DskipTests clean compile

# Tests - runs JUnit tests & verifies JaCoCo coverage threshold + publish reports
test:
  stage: test
  script:
    - mvn $MAVEN_CLI_OPTS clean verify
  artifacts:
    when: always
    expire_in: 3 days
    paths:
      - target/site/jacoco/jacoco.xml
      - target/site/jacoco/**
      - target/surefire-reports/*.xml
    reports:
      junit: target/surefire-reports/*.xml
      coverage_report:
        coverage_format: jacoco
        path: target/site/jacoco/jacoco.xml

# Package - produce final jar (-DskipTests to save time, comes after `test` anyway)
package:
  stage: package
  script:
    - mvn $MAVEN_CLI_OPTS -DskipTests clean package
  #artifacts:           # disabled because of new upload size restrictions in GitLab 
  #  when: on_success
  #  paths:
  #    - target/*-fat.jar
  #  expire_in: 1 week
  only:
    - main
    - dev

# Release - create GitLab release on new tag, attach built jar
release:
  stage: release
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - VERSION="${CI_COMMIT_TAG#v}"
    - JAR_NAME="worms-${VERSION}-fat.jar"

    - mvn -DskipTests clean package

    - PACKAGE_URL="$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/worms/${VERSION}/${JAR_NAME}"

    - |
      curl --fail --header "JOB-TOKEN: $CI_JOB_TOKEN" \
           --upload-file "target/${JAR_NAME}" \
           "$PACKAGE_URL"

    - |
      release-cli create \
        --name "Release v${VERSION}" \
        --tag-name "$CI_COMMIT_TAG" \
        --description "$(cat CHANGELOG.md)" \
        --assets-link \
          "{\"name\":\"Build Artifacts (fatjar)\",\"url\":\"${PACKAGE_URL}\"}"
